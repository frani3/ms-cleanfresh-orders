server:
  port: 8081
spring:
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # El broker confirma cada publicación y devuelve los mensajes que no llegaron a ninguna cola.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: ms-cleanfresh-orders
  # Sin valores por defecto a propósito: la conexión llega solo por
  # variables de entorno y el servicio no arranca si faltan.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Mensajería de comandos con RabbitMQ (Spec 033): orders publica en los exchanges cmd.direct y
# cmd.topic. Apagada por defecto: sin RabbitMQ (desarrollo local) el servicio funciona igual.
# RABBITMQ_ADDRESSES admite varios nodos separados por coma (host1:5672,host2:5673).
app:
  rabbit:
    enabled: ${RABBIT_ENABLED:false}
